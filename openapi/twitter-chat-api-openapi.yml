        previous_sequence_id:
          type: string
          description: The sequence ID of the previous message.
          example: '1234567890'
        sender_id:
          type: string
          description: The user ID of the message sender.
          example: '1234567890'
        sequence_id:
          type: string
          description: The sequence identifier for ordering messages.
          example: '1234567890'
    UrlEntity:
