    ChatConversation:
      type: object
      description: A Chat conversation resource representing either a direct or group conversation.
      required:
      - id
      properties:
        admin_ids:
          type: array
          description: User IDs of group admins. Only present for group conversations.
          items:
            type: string
          example:
          - '1234567890'
        created_at:
          type: string
          description: ISO 8601 timestamp when the group was created. Only present for group conversations.
          example: example_value
        group_avatar_url:
          type: string
          description: URL for the group avatar. Only present for group conversations.
          example: https://x.com/exampleuser
        group_name:
          type: string
          description: Encrypted group name. Only present for group conversations.
          example: Example User
        id:
          type: string
          description: The unique identifier for this conversation.
          example: '1234567890'
        is_muted:
          type: boolean
          description: Whether notifications are muted for this conversation.
          example: true
        member_ids:
          type: array
          description: User IDs of group members. Only present for group conversations.
          items:
            type: string
          example:
          - '1234567890'
        message_ttl_msec:
          type: string
          description: Message time-to-live in milliseconds.
          example: Hello from the X API!
        participant_ids:
          type: array
          description: Array of user IDs who are participants in this conversation.
          items:
            type: string
          example:
          - '1234567890'
        screen_capture_blocking_enabled:
          type: boolean
          description: Whether screen capture blocking is enabled for this conversation.
          example: true
        screen_capture_detection_enabled:
          type: boolean
          description: Whether screen capture detection is enabled for this conversation.
          example: true
        type:
          type: string
          description: 'The type of conversation: ''direct'' or ''group''.'
          enum:
          - direct
          - group
          example: direct
        updated_at:
          type: string
          description: ISO 8601 timestamp when the group was last updated. Only present for group conversations.
          example: example_value
    ChatJuiceboxConfig:
      type: object
      description: Key recovery configuration for Juicebox-based key storage.
      properties:
        key_store_token_map_json:
          type: string
          description: Raw JSON for key recovery configuration.
          example: next_token_abc123
        max_guess_count:
          type: integer
          description: Maximum guess count for key recovery.
          example: 10
        realm_state_string:
          type: string
          description: Serialized realm state for key recovery.
          example: active
        recover_threshold:
          type: integer
          description: Threshold required to recover the key.
          example: 42
        register_threshold:
          type: integer
          description: Threshold required to register the key.
          example: 42
        token_map:
          type: array
          description: Per-realm auth tokens for key recovery.
          items:
            type: object
            properties:
              key:
                type: string
                description: Realm identifier.
              value:
                type: object
                description: Realm connection details.
                properties:
                  address:
                    type: string
                    description: Realm URL.
                  public_key:
                    type: string
                    description: Realm public key.
                  token:
                    type: string
                    description: JWT auth token for the realm.
          example: []
    CommunityId:
      type: string
      description: The unique identifier of this Community.
      pattern: ^[0-9]{1,19}$
      example: '1146654567674912769'
    Get2UsersIdPublicKeysResponse:
      type: object
      properties:
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicKey'
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Problem'
    DisplayTextRange:
      type: array
      description: Represent a boundary range (start and end zero-based indices) for the portion of text that is displayed for a post. `start` must be smaller than `end`. The start index is inclusive, the end index is exclusive.
      minItems: 2
      maxItems: 2
      items:
        type: integer
        minimum: 0
    ChatActionSignature:
      type: object
      description: Cryptographic signature for a chat action.
      properties:
        encoded_message_event_detail:
          type: string
          description: Base64-encoded message event detail.
          example: Hello from the X API!
        message_event_signature:
          $ref: '#/components/schemas/ChatMessageEventSignature'
        message_id:
          type: string
          description: ID of the message being signed.
          example: '1234567890'
        signature_payload:
          type: string
          description: Cryptographic signature payload.
          example: example_value
    User:
      type: object
      description: The X User object.
      required:
      - id
      - name
      - username
      properties:
        affiliation:
          type: object
          description: Metadata about a user's affiliation.
          properties:
            badge_url:
              type: string
              description: The badge URL corresponding to the affiliation.
              format: uri
            description:
              type: string
              description: The description of the affiliation.
            url:
              type: string
              description: The URL, if available, to details about an affiliation.
              format: uri
            user_id:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/UserId'
        connection_status:
          type: array
          description: Returns detailed information about the relationship between two users.
          minItems: 0
          items:
            type: string
            description: Type of connection between users.
            enum:
            - follow_request_received
            - follow_request_sent
            - blocking
            - followed_by
            - following
            - muting
        created_at:
          type: string
          description: Creation time of this User.
          format: date-time
        description:
          type: string
          description: The text of this User's profile description (also known as bio), if the User provided one.
        entities:
          type: object
          description: A list of metadata found in the User's profile description.
          properties:
            description:
              $ref: '#/components/schemas/FullTextEntities'
            url:
              type: object
              description: Expanded details for the URL specified in the User's profile, with start and end indices.
              properties:
                urls:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/UrlEntity'
        id:
          $ref: '#/components/schemas/UserId'
        location:
          type: string
          description: The location specified in the User's profile, if the User provided one. As this is a freeform value, it may not indicate a valid location, but it may be fuzzily evaluated when performing searches with location queries.
        most_recent_tweet_id:
          $ref: '#/components/schemas/TweetId'
        name:
          type: string
          description: The friendly name of this User, as shown on their profile.
        pinned_tweet_id:
          $ref: '#/components/schemas/TweetId'
        profile_banner_url:
          type: string
          description: The URL to the profile banner for this User.
          format: uri
        profile_image_url:
          type: string
          description: The URL to the profile image for this User.
          format: uri
        protected:
          type: boolean
          description: Indicates if this User has chosen to protect their Posts (in other words, if this User's Posts are private).
        public_metrics:
          type: object
          description: A list of metrics for this User.
          required:
          - followers_count
          - following_count
          - tweet_count
          - listed_count
          properties:
            followers_count:
              type: integer
              description: Number of Users who are following this User.
            following_count:
              type: integer
              description: Number of Users this User is following.
            like_count:
              type: integer
              description: The number of likes created by this User.
            listed_count:
              type: integer
              description: The number of lists that include this User.
            tweet_count:
              type: integer
              description: The number of Posts (including Retweets) posted by this User.
        receives_your_dm:
          type: boolean
          description: Indicates if you can send a DM to this User
        subscription_type:
          type: string
          description: 'The X Blue subscription type of the user, eg: Basic, Premium, PremiumPlus or None.'
          enum:
          - Basic
          - Premium
          - PremiumPlus
          - None
        url:
          type: string
          description: The URL specified in the User's profile.
        username:
          $ref: '#/components/schemas/UserName'
        verified:
          type: boolean
          description: Indicate if this User is a verified X User.
        verified_type:
          type: string
          description: 'The X Blue verified type of the user, eg: blue, government, business or none.'
          enum:
          - blue
          - government
          - business
          - none
        withheld:
          $ref: '#/components/schemas/UserWithheld'
      example:
        created_at: '2013-12-14T04:35:55Z'
        id: '2244994945'
        name: X Dev
        protected: false
        username: TwitterDev
    ChatMediaUploadFinalizeResponse:
