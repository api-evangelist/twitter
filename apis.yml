- type: Features
  data:
  - name: Post Management
    description: Create, delete, edit, repost, quote, like, and bookmark posts programmatically.
  - name: Real-Time Streaming
    description: Access filtered streams, sampled streams, firehose, and language-specific
      streams for real-time post data.
  - name: Full-Archive Search
    description: Search the complete archive of public posts with advanced query operators
      and date filtering.
  - name: User Lookup and Management
    description: Look up users by ID or username, manage follows, blocks, mutes, and
      retrieve user metrics.
  - name: Spaces
    description: Discover and look up live audio Spaces with host, speaker, and listener
      data.
  - name: Direct Messages
    description: Send and receive direct messages, create conversations, and manage
      participants.
  - name: Lists
    description: Create, manage, and query lists including membership, followers,
      and pinned lists.
  - name: Trends
    description: Access personalized and geographic trending topics.
  - name: Media Upload
    description: Upload images, videos, and large files using chunked upload with
      metadata and subtitle support.
  - name: Compliance
    description: Access compliance streams and batch jobs for data deletion and user
      protection events.
  - name: Communities and Community Notes
    description: Access community data and community notes for collaborative fact-checking.
  - name: Ad Campaign Management
    description: Programmatically create, schedule, and manage advertising campaigns
      with targeting and budget controls.
- type: UseCases
  data:
  - name: Social Listening
    description: Monitor brand mentions, sentiment, and conversations in real-time
      using filtered streams and search endpoints.
  - name: Content Publishing
    description: Automate post creation, scheduling, and thread publishing for social
      media management platforms.
  - name: Analytics and Reporting
    description: Retrieve post metrics, user engagement data, and campaign performance
      for business intelligence.
  - name: Bot Development
    description: Build automated accounts that respond to mentions, post updates,
      or provide customer service.
  - name: Research and Academic Analysis
    description: Access full-archive search and streaming data for social media research
      and trend analysis.
  - name: Advertising Automation
    description: Programmatically manage ad campaigns, audiences, creatives, and bidding
      strategies at scale.
  - name: Real-Time Event Monitoring
    description: Track live events, breaking news, and trending topics with streaming
      APIs and trend endpoints.
  - name: Community Management
    description: Manage followers, lists, and direct messages for community engagement
      and moderation.
- type: Integrations
  data:
  - name: Postman
    description: Official Postman collections for exploring and testing X API endpoints
      interactively.
  - name: MCP Servers
    description: Integration with AI tools and agents through Model Context Protocol
      servers.
  - name: Webhook Delivery
    description: Real-time event delivery via webhooks for the Activity API.
- type: Solutions
  data:
  - name: X API Pay-Per-Use
    description: Credit-based pricing with no commitments. Pay only for what you use
      with access to core X API endpoints.
  - name: X API Enterprise
    description: High-volume access with custom rate limits, dedicated account management,
      full firehose, and premium support.
  - name: X Ads API
    description: Advertising platform API for campaign management, audience targeting,
      creative management, and analytics.
