apis:
- aid: twitter:x-ads-api
  name: X Ads API
  description: >-
    The X Ads API enables programmatic management of advertising campaigns on the X platform including
    campaign creation and scheduling, custom audience building, creative management (draft posts, cards,
    media), and analytics retrieval for campaign performance metrics. Supports both synchronous and asynchronous
    analytics endpoints for reporting.
  image: https://abs.twimg.com/favicons/twitter.ico
  humanURL: https://docs.x.com/x-ads-api
  baseURL: https://ads-api.x.com
  properties:
  - type: Documentation
    url: https://docs.x.com/x-ads-api
  - type: GettingStarted
    url: https://docs.x.com/x-ads-api/getting-started/create-a-campaign
  - type: RateLimits
    url: https://docs.x.com/x-ads-api/fundamentals/rate-limiting
  tags:
  - Advertising
  - Campaigns
  - Analytics
  - Audiences
  - Creatives
- aid: twitter:x-activity-api
  name: X Activity API
  description: >-
    The X Activity API provides real-time activity event subscriptions with sub-second delivery via streaming
    or webhooks. Subscribe to profile updates, follows, likes, reposts, and other user activity events.
    Recently exited beta and is now generally available.
  image: https://abs.twimg.com/favicons/twitter.ico
  humanURL: https://docs.x.com/x-activity-api
  baseURL: https://api.x.com
  properties:
  - type: Documentation
    url: https://docs.x.com/x-activity-api
  tags:
  - Activity
